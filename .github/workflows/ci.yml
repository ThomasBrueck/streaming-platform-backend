name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - stream-service
          - chat-service

    name: test / ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B verify
        env:
          JWT_SECRET: ci-test-secret-at-least-32-bytes-long-for-hs256

  build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - discovery-server
          - auth-service
          - user-service
          - stream-service
          - chat-service

    name: build / ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Package (skip tests — already passed)
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B package -DskipTests
        env:
          JWT_SECRET: ci-build-secret-at-least-32-bytes-long-for-hs256
