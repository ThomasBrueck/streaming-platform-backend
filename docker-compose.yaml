# Eureka defaults take ~1 minute to propagate a new instance to the gateway, during
# which every request through it returns 503. Short intervals keep a cold start fast.
x-eureka-client: &eureka-client
  EUREKA_CLIENT_INITIALINSTANCEINFOREPLICATIONINTERVALSECONDS: "5"
  EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS: "5"
  EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://:9093,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started

  user-db:
    image: postgres:17-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: useradmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  auth-db:
    image: postgres:17-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5434:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  stream-db:
    image: postgres:17-alpine
    container_name: stream-db
    environment:
      POSTGRES_DB: streamdb
      POSTGRES_USER: streamadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5433:5432"
    volumes:
      - stream-db-data:/var/lib/postgresql/data

  chat-db:
    image: postgres:17-alpine
    container_name: chat-db
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5435:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_SERVER_USEREADONLYRESPONSECACHE: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *eureka-client
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    depends_on:
      discovery-server:
        condition: service_healthy

  user-service:
    build: ./user-service
    container_name: user-service
    # No host ports — only reachable via the API gateway (prevents header spoofing)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: useradmin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123}
      <<: *eureka-client
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-server:
        condition: service_healthy
      user-db:
        condition: service_started
      kafka:
        condition: service_started

  auth-service:
    build: ./auth-service
    container_name: auth-service
    # No host ports — only reachable via the API gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: authadmin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123}
      <<: *eureka-client
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-db:
        condition: service_started
      kafka:
        condition: service_started

  stream-service:
    build: ./stream-service
    container_name: stream-service
    # No host ports — reached via the API gateway; LiveKit webhooks use the
    # Docker network directly (http://stream-service:8082).
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://stream-db:5432/streamdb
      SPRING_DATASOURCE_USERNAME: streamadmin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123}
      <<: *eureka-client
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-for-local-development-only-not-for-prod}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
    depends_on:
      discovery-server:
        condition: service_healthy
      stream-db:
        condition: service_started
      kafka:
        condition: service_started

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

  chat-service:
    build: ./chat-service
    container_name: chat-service
    # No host ports — only reachable via the API gateway
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://chat-db:5432/chatdb
      SPRING_DATASOURCE_USERNAME: chatadmin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123}
      <<: *eureka-client
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      discovery-server:
        condition: service_healthy
      chat-db:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  user-db-data:
  auth-db-data:
  stream-db-data:
  chat-db-data:
