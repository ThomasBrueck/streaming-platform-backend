# Test profile: in-memory H2 instead of a real Postgres, no Flyway, no Eureka
# registration — lets `./mvnw test` run standalone without any infra up.
spring.datasource.url=jdbc:h2:mem:streamdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

spring.kafka.consumer.group-id=stream-service

livekit.api-key=test-key
livekit.api-secret=test-secret-at-least-32-bytes-long
livekit.ws-url=ws://localhost:7880
