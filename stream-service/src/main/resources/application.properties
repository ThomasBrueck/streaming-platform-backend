spring.application.name=stream-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/streamdb
spring.datasource.username=streamadmin
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# LiveKit (WebRTC SFU) — must match the keys configured in livekit.yaml.
# The secret NEVER leaves this service: tokens are minted here and handed to clients.
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:devsecret-for-local-development-only-not-for-prod}
livekit.ws-url=${LIVEKIT_WS_URL:ws://localhost:7880}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=stream-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=${KAFKA_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
spring.kafka.consumer.value-deserializer=${KAFKA_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.JsonDeserializer}
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.streaming.stream_service.event.UserDeletedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*