port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  port_range_start: 7881
  port_range_end: 7882
  use_external_ip: false
  tcp_port: 7881
  udp_port: 7882
keys:
  # HS256 requires a key >= 256 bits (32 bytes) — a short word like "devsecret"
  # is rejected by the JVM's JWT library, so the dev default must be long too.
  devkey: devsecret-for-local-development-only-not-for-prod
webhook:
  api_key: devkey
  urls:
    - http://stream-service:8082/api/streams/webhook/livekit
logging:
  level: info
